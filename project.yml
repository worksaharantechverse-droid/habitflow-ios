{
  "name": "HabitFlow",
  "options": {
    "deploymentTarget": "17.0",
    "createIntermediateGroups": true,
    "bundleIdPrefix": "com.portfolio",
    "groupSortPosition": "top"
  },
  "settings": {
    "SWIFT_VERSION": "5.0",
    "IPHONEOS_DEPLOYMENT_TARGET": "17.0",
    "CLANG_ENABLE_MODULES": true,
    "ALWAYS_SEARCH_USER_PATHS": false,
    "ENABLE_USER_SCRIPT_SANDBOXING": true,
    "DEVELOPMENT_TEAM": "",
    "CODE_SIGN_STYLE": "Automatic",
    "MARKETING_VERSION": "1.0",
    "CURRENT_PROJECT_VERSION": "1",
    "GENERATE_INFOPLIST_FILE": true
  },
  "targets": {
    "HabitFlow": {
      "type": "application",
      "platform": "iOS",
      "sources": [
        "Sources/HabitFlow",
        "Resources"
      ],
      "resources": [
        "Resources/Assets.xcassets"
      ],
      "info": {
        "path": "Sources/HabitFlow/Info.plist",
        "properties": {
          "CFBundleDisplayName": "HabitFlow",
          "UILaunchScreen": {},
          "UIApplicationSupportsIndirectInputEvents": true,
          "ITSAppUsesNonExemptEncryption": false
        }
      },
      "settings": {
        "PRODUCT_BUNDLE_IDENTIFIER": "com.portfolio.habitflow",
        "ASSETCATALOG_COMPILER_APPICON_NAME": "AppIcon",
        "ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME": "AccentColor",
        "SWIFT_EMIT_LOC_STRINGS": true,
        "CODE_SIGN_STYLE": "Automatic",
        "TARGETED_DEVICE_FAMILY": "1",
        "SUPPORTS_MACCATALYST": false
      }
    },
    "HabitFlowTests": {
      "type": "bundle.unit-test",
      "platform": "iOS",
      "sources": [
        "Tests/HabitFlowTests"
      ],
      "dependencies": [
        {
          "target": "HabitFlow"
        }
      ],
      "settings": {
        "PRODUCT_BUNDLE_IDENTIFIER": "com.portfolio.habitflow.tests",
        "CODE_SIGN_STYLE": "Automatic"
      }
    },
    "HabitFlowUITests": {
      "type": "bundle.ui-testing",
      "platform": "iOS",
      "sources": [
        "UITests/HabitFlowUITests"
      ],
      "dependencies": [
        {
          "target": "HabitFlow"
        }
      ],
      "settings": {
        "PRODUCT_BUNDLE_IDENTIFIER": "com.portfolio.habitflow.uitests",
        "CODE_SIGN_STYLE": "Automatic"
      }
    }
  },
  "schemes": [
    {
      "name": "HabitFlow",
      "buildTargets": [
        {
          "target": "HabitFlow",
          "debug": true,
          "profile": true,
          "analyze": true,
          "archive": true
        }
      ],
      "testTargets": [
        {
          "target": "HabitFlowTests"
        },
        {
          "target": "HabitFlowUITests"
        }
      ],
      "launchAction": {
        "target": "HabitFlow",
        "debugger": "lldb"
      },
      "profileAction": {
        "target": "HabitFlow"
      },
      "analyzeAction": {
        "target": "HabitFlow"
      },
      "archiveAction": {
        "target": "HabitFlow",
        "revealArchiveInOrganizer": false
      }
    }
  ]
}
